<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Creator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #e0e5ec; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .wrapper { background: #e0e5ec; width: 380px; padding: 40px; border-radius: 20px; box-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5); text-align: center; }
        h2 { color: #31344b; margin-bottom: 25px; }
        input { width: 100%; padding: 15px; border: none; outline: none; border-radius: 10px; background: #e0e5ec; box-shadow: inset 6px 6px 10px 0 rgba(163,177,198,0.6), inset -6px -6px 10px 0 rgba(255,255,255,0.5); margin-bottom: 25px; font-size: 16px; }
        button { width: 100%; padding: 15px; border: none; outline: none; border-radius: 10px; color: white; background: #6c5ce7; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 6px 6px 10px 0 rgba(108, 92, 231, 0.3); transition: 0.2s; }
        button:active { box-shadow: inset 4px 4px 10px 0 rgba(0,0,0,0.2); transform: translateY(2px); }
        .qr-box { margin-top: 30px; display: none; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); animation: fadeIn 0.5s ease; }
        .qr-box img { width: 100%; display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="wrapper">
        <h2>Scan Me.</h2>
        <input type="text" id="qrData" placeholder="Enter URL or Text">
        <button onclick="generate()">Generate QR</button>
        <div class="qr-box" id="box"><img id="img" src="" alt="QR"></div>
    </div>
    <script>
        function generate() {
            const data = document.getElementById('qrData').value.trim();
            if (!data) return;
            const img = document.getElementById('img');
            img.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(data)}`;
            document.getElementById('box').style.display = 'block';
        }
    </script>
</body>
</html>
