<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure ATM Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Mono', monospace; }
        body { background: #000; color: #0f0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .terminal { background: #051005; border: 2px solid #0f0; width: 450px; padding: 40px; box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); }
        h2 { text-align: center; border-bottom: 2px dashed #0f0; padding-bottom: 10px; margin-bottom: 25px; font-size: 20px; }
        p { margin-bottom: 15px; }
        input { width: 100%; background: transparent; border: 1px solid #0f0; color: #0f0; padding: 15px; font-size: 18px; outline: none; margin-bottom: 20px; text-align: center; }
        input::placeholder { color: rgba(0,255,0,0.3); }
        .btn-group { display: flex; gap: 15px; }
        button { flex: 1; background: transparent; border: 1px solid #0f0; color: #0f0; padding: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        button:hover { background: #0f0; color: #000; }
        .hidden { display: none; }
        .balance-box { font-size: 32px; text-align: center; margin: 30px 0; font-weight: 700; text-shadow: 0 0 10px rgba(0,255,0,0.5); }
    </style>
</head>
<body>
    <div class="terminal">
        <h2>SECURE_BANKING_OS_V2.1</h2>
        <div id="authPanel">
            <p>> AWAITING USER AUTHENTICATION...</p>
            <input type="password" id="pin" placeholder="ENTER 4-DIGIT PIN" maxlength="4">
            <button onclick="login()">AUTHORIZE</button>
        </div>
        <div id="dashboard" class="hidden">
            <p>> AUTHENTICATION SUCCESSFUL</p>
            <div class="balance-box">BAL: $<span id="bal">1500.00</span></div>
            <input type="number" id="amt" placeholder="ENTER AMOUNT">
            <div class="btn-group">
                <button onclick="transact('D')">DEPOSIT</button>
                <button onclick="transact('W')">WITHDRAW</button>
            </div>
        </div>
    </div>
    <script>
        let bal = 1500.00;
        function login() {
            if(document.getElementById('pin').value === '1234') {
                document.getElementById('authPanel').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
            } else { alert("ACCESS DENIED: INCORRECT PIN"); }
        }
        function transact(type) {
            const val = parseFloat(document.getElementById('amt').value);
            if(isNaN(val) || val <= 0) return alert("ERROR: INVALID AMOUNT");
            if(type === 'W' && val > bal) return alert("ERROR: INSUFFICIENT FUNDS");
            bal = type === 'D' ? bal + val : bal - val;
            document.getElementById('bal').innerText = bal.toFixed(2);
            document.getElementById('amt').value = '';
        }
    </script>
</body>
</html>
