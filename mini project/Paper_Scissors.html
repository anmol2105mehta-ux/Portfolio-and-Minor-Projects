<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissors</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { min-height: 100vh; background: #1a202c; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        h1 { font-size: 3rem; margin-bottom: 40px; color: #edf2f7; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .game-board { background: #2d3748; padding: 50px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center; }
        .controls { display: flex; gap: 20px; justify-content: center; margin-bottom: 40px; }
        .btn { font-size: 50px; background: #4a5568; border: none; border-radius: 20px; padding: 20px 30px; cursor: pointer; transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .btn:hover { background: #718096; transform: scale(1.15) translateY(-10px); }
        .btn:active { transform: scale(0.95); }
        #result { font-size: 1.5rem; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #63b3ed; }
        .winner { color: #68d391 !important; font-size: 2rem !important; }
        .loser { color: #fc8181 !important; font-size: 2rem !important; }
    </style>
</head>
<body>
    <h1>Battle of Elements</h1>
    <div class="game-board">
        <div class="controls">
            <button class="btn" onclick="play('Stone')" title="Stone">🪨</button>
            <button class="btn" onclick="play('Paper')" title="Paper">📄</button>
            <button class="btn" onclick="play('Scissors')" title="Scissors">✂️</button>
        </div>
        <div id="result">Choose your weapon to start!</div>
    </div>
    <script>
        function play(user) {
            const choices = ['Stone', 'Paper', 'Scissors'];
            const comp = choices[Math.floor(Math.random() * 3)];
            const resEl = document.getElementById('result');
            
            if (user === comp) {
                resEl.innerHTML = `You: ${user} vs Comp: ${comp}<br><span style="color: #fbd38d;">It's a Draw! 🤝</span>`;
                resEl.className = '';
            } else if ((user === 'Stone' && comp === 'Scissors') || (user === 'Paper' && comp === 'Stone') || (user === 'Scissors' && comp === 'Paper')) {
                resEl.innerHTML = `You: ${user} vs Comp: ${comp}<br><span>Victory! 🎉</span>`;
                resEl.className = 'winner';
            } else {
                resEl.innerHTML = `You: ${user} vs Comp: ${comp}<br><span>Defeat! 💀</span>`;
                resEl.className = 'loser';
            }
        }
    </script>
</body>
</html>
